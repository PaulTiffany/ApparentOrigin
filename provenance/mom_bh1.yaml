upstream:
  zenodo_doi: "10.5281/zenodo.15059214"
  zenodo_api: "https://zenodo.org/api/records/15059214"
  dja_home: "https://dawn-cph.github.io/dja/"
  dja_query: "https://grizli-cutout.herokuapp.com/nirspec_extractions?coords={ra},{dec}&size={size}&output=csv"
  dja_file: "https://s3.amazonaws.com/msaexp-nirspec/extractions/{root}/{file}"

acquisition:
  # Protect hosted runners from accidentally mirroring a large archive.
  max_file_mb: 128
  max_total_mb: 256
  dja_radius_arcsec: 0.6

experiment:
  hbeta_half_window_um: 0.07
  target_resolutions: [1200, 1000, 800, 600, 400, 250, 150, 100]
  falsification:
    # Predeclared phase-0 thresholds. A scientific negative result does not fail CI.
    min_full_delta_bic: 10.0
    min_delta_bic_drop: 5.0
