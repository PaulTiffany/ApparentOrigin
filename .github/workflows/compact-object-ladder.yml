name: Compact-object transfer ladder

on:
  pull_request:
    paths:
      - "simulations/compact_object_ladder/**"
      - ".github/workflows/compact-object-ladder.yml"
  push:
    branches: [main]
    paths:
      - "simulations/compact_object_ladder/**"
      - ".github/workflows/compact-object-ladder.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test transfer identities
        working-directory: simulations/compact_object_ladder
        run: python -m unittest -v test_compact_object_ladder.py
      - name: Regenerate fixed reference ladder
        working-directory: simulations/compact_object_ladder
        run: python compact_object_ladder.py
      - name: Require deterministic result
        run: git diff --exit-code -- simulations/compact_object_ladder/reference_results.csv
