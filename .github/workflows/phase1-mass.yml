name: Phase 1A mass residue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phase1-mass.yml"
      - "provenance/mom_bh1.yaml"
      - "requirements.txt"
      - "src/acquire.py"
      - "src/acquire_exact.py"
      - "src/experiment.py"
      - "src/phase1_mass.py"
      - "docs/phase1-preregistration.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase1-mass.yml"
      - "provenance/mom_bh1.yaml"
      - "requirements.txt"
      - "src/acquire.py"
      - "src/acquire_exact.py"
      - "src/experiment.py"
      - "src/phase1_mass.py"
      - "docs/phase1-preregistration.md"

permissions:
  contents: read

jobs:
  phase1a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experiment code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q src

      - name: Acquire exact public spectra
        run: |
          python src/acquire_exact.py --manifest provenance/mom_bh1.yaml --out run

      - name: Record software environment
        run: |
          mkdir -p run/provenance
          python -m pip freeze > run/provenance/python-freeze-phase1.txt
          python --version > run/provenance/python-version-phase1.txt

      - name: Run preregistered Phase 1A mass-residue test
        run: |
          python src/phase1_mass.py \
            --input run/raw/excels_g395m.fits \
            --manifest provenance/mom_bh1.yaml \
            --out run/phase1

      - name: Publish Phase 1A scientific result
        if: always()
        run: |
          if [ -f run/phase1/summary.md ]; then
            cat run/phase1/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Phase 1A did not reach the scientific summary stage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload only receipts and derived results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-bh1-phase1a-mass-residue
          path: |
            run/provenance/
            run/phase1/
          if-no-files-found: warn
          retention-days: 30
